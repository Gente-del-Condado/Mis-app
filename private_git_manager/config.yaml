name: HA Private Git Manager
version: "0.17.0"
slug: private_git_manager
description: Gestiona claves SSH y aplicaciones de repositorios privados GitHub, Forgejo y Gitea.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_stream: true
ingress_port: 8099
panel_icon: mdi:source-repository
panel_title: Private Git
panel_admin: true
timeout: 300
watchdog: "http://[HOST]:8099/health"
hassio_api: true
hassio_role: manager
map:
  - type: addon_config
    read_only: false
    path: /config
  - type: addons
    read_only: false
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
options: {}
schema: {}
