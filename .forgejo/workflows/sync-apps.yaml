name: Sincronizar catálogo Mis-app

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: sync-mis-app
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copiar los complementos y publicar los cambios
        env:
          DEPLOY_KEY: ${{ secrets.MIS_APP_SYNC_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo 'Falta el secreto MIS_APP_SYNC_SSH_KEY. Consulta README.md.' >&2
            exit 1
          fi

          work=$(mktemp -d /tmp/mis-app-sync.XXXXXXXX)
          trap 'rm -rf -- "$work"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$work/key"
          unset DEPLOY_KEY
          cat > "$work/known_hosts" <<'HOSTS'
          [gentedelcondado.es]:2233 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEV4EWbIkELBR3ba0QeSh+K7ceSXVLavPtUjRI+4kwHL
          HOSTS
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $work/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$work/known_hosts"
          umask 022

          git clone --quiet --depth 1 --single-branch --branch main \
            ssh://forgejo@gentedelcondado.es:2233/wolfbelmi88/Mis-app.git "$work/store"
          cd "$work/store"
          bash scripts/sync-apps.sh
          git add -- private_git_manager jacksignal_installer pivigia headscale_gateway
          if git diff --cached --quiet; then
            echo 'El catálogo ya está actualizado.'
            exit 0
          fi
          git -c user.name='Mis-app Sync' -c user.email='mis-app-sync@noreply.gentedelcondado.es' \
            commit -qm 'Sincronizar complementos desde Forgejo'
          git push origin HEAD:main
